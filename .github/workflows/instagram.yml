name: Publication Instagram

on:
  schedule:
    - cron: "5 6 * * *"    # vers 8 h à Paris (7 h en hiver) : post « Ce jour-là »
    - cron: "5 16 * * *"   # vers 18 h à Paris (17 h en hiver) : post focus
    - cron: "0 9 * * 1"    # chaque lundi : prolongation du jeton Instagram
  workflow_dispatch:
    inputs:
      kind:
        description: "Carrousel à publier (jour ou focus)"
        default: "jour"
      dry_run:
        description: "Essai à blanc, sans publier (true/false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'schedule' || github.event.schedule != '0 9 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer le rendu
        run: |
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium
      - name: Publier
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            KIND="${{ inputs.kind }}"
            EXTRA=$([ "${{ inputs.dry_run }}" = "true" ] && echo "--dry-run" || echo "")
          elif [ "${{ github.event.schedule }}" = "5 6 * * *" ]; then
            KIND=jour; EXTRA=""
          else
            KIND=focus; EXTRA=""
          fi
          python tools/ig_publish.py "$KIND" $EXTRA

  refresh-token:
    if: github.event_name == 'schedule' && github.event.schedule == '0 9 * * 1'
    runs-on: ubuntu-latest
    steps:
      - name: Prolonger le jeton Instagram
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          case "$IG_TOKEN" in EAA*) echo "Jeton de Page Facebook : pas d expiration, rien à faire"; exit 0;; esac
          curl -fsS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_TOKEN}" | python -c "import json,sys; d=json.load(sys.stdin); print('Jeton prolongé, valable', d.get('expires_in',0)//86400, 'jours')"
